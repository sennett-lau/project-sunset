[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
sunset-domain = { path = "crates/sunset-domain" }
sunset-providers = { path = "crates/sunset-providers" }
sunset-store = { path = "crates/sunset-store" }
sunset-core = { path = "crates/sunset-core" }

thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
