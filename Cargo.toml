[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
sunset-domain = { path = "crates/sunset-domain" }
sunset-providers = { path = "crates/sunset-providers" }
sunset-store = { path = "crates/sunset-store" }
sunset-core = { path = "crates/sunset-core" }

async-trait = "0.1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3"
keyring-core = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2", "charset"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# specta, specta-typescript and tauri-specta are pre-releases that must match each other exactly.
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid", "chrono", "serde_json"] }
specta-typescript = "=0.0.13"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "json", "chrono", "uuid"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
